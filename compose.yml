services:
  mysql:
    image: mysql:latest
    container_name: jobportaldb

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobportal
      MYSQL_USER: jobportal
      MYSQL_PASSWORD: jobportal

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: